<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Pro Store - Redirecting...</title>
    <meta name="description" content="Professional gaming equipment and accessories store">
    <link rel="icon" href="/favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0F1419 0%, #1e293b 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0078D4, #00d4ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            font-weight: bold;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #0078D4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0078D4, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        .redirect-link {
            color: #0078D4;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border: 2px solid #0078D4;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .redirect-link:hover {
            background: #0078D4;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">GP</div>
        <h1>Gaming Pro Store</h1>
        <p>Redirecting to the main application...</p>
        <div class="spinner"></div>
        <p>If you're not redirected automatically, <a href="/public/index.html" class="redirect-link">click here</a></p>
    </div>

    <script>
        // Redirect to Next.js app after 2 seconds
        setTimeout(() => {
            window.location.href = '/public/index.html';
        }, 2000);
    </script>
</body>
</html>
